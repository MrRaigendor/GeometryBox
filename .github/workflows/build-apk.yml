name: Build Geometry Dash Deluxe
on:
  push:
    branches: [ geometry-dash-deluxe ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install asset tools
        run: python -m pip install --disable-pip-version-check numpy pillow
      - name: Generate real game content
        run: python tools/generate_assets.py
      - name: Build Android APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -n 2
      - uses: actions/upload-artifact@v4
        with:
          name: geometry-dash-deluxe-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
